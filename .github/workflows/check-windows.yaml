# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help

name: Build (Windows UCRT)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow}}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: windows-latest, r: "4.3" }
          - { os: windows-latest, r: "release" }
          - { os: windows-latest, r: "devel", http-user-agent: "release" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Setup ecCodes (MSYS2 Bridge)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          RTOOLS_PATH="${RTOOLS45_HOME:-${RTOOLS44_HOME}:-${RTOOLS43_HOME}}"

          export MSYS=winsymlinks:nativestrict
          PACMAN="${RTOOLS_PATH}\usr\bin\pacman.exe"

          "$PACMAN" -Sy --noconfirm
          "$PACMAN" -S mingw-w64-ucrt-x86_64-eccodes --noconfirm

          UCRT_BIN="${RTOOLS_PATH}\ucrt64\bin"
          UCRT_DEF="${RTOOLS_PATH}\ucrt64\share\eccodes\definitions"

          UCRT_DEF=$(echo "$UCRT_DEF" | tr '\\' '/')

          echo "$UCRT_BIN" >> $GITHUB_PATH

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
